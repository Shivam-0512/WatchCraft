<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldPlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Rounded App Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Outer Cyan Border Accent -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="12.5" fill="none" stroke="url(#cyanGlow)" stroke-width="1.5" opacity="0.85" />

  <!-- TV Monitor Body -->
  <rect x="11" y="13" width="42" height="29" rx="4" fill="#090d16" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
  
  <!-- TV Inner Screen -->
  <rect x="13.5" y="15.5" width="37" height="24" rx="2" fill="#030712" />

  <!-- Play Symbol / Watch Party Icon -->
  <polygon points="28,21 41,27.5 28,34" fill="url(#goldPlay)" />

  <!-- TV Stand Base -->
  <rect x="29" y="42" width="6" height="5" fill="#38bdf8" opacity="0.9" />
  <rect x="23" y="47" width="18" height="3" rx="1.5" fill="#38bdf8" />
  
  <!-- Subtle pixel grid highlights -->
  <circle cx="16" cy="18" r="1" fill="#38bdf8" opacity="0.7" />
  <circle cx="20" cy="18" r="1" fill="#38bdf8" opacity="0.4" />
</svg>
